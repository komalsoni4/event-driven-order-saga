[pytest]
asyncio_mode = auto
; No `testpaths` on purpose: each service's app/ package is named "app", so
; running pytest across multiple service dirs in one process would collide
; on sys.modules["app"]. Always invoke pytest scoped to one directory at a
; time, e.g. `pytest shared/tests`, `pytest order-service/tests`, etc.
; (mirrors how each service also runs isolated in its own Docker container).
